<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>coral — Riff, Play, Share.</title>
<meta name="description" content="Riff, Play, Share. coral is where ModulateJS prototypes run: write a few lines, feel it on your phone, send the link. No login, nothing stored: the code lives in the URL.">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate" type="text/markdown" href="/index.md" title="This page, for models">
<link rel="alternate" type="text/markdown" href="/spec.md" title="The spec">
<link rel="help" href="/llms.txt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!--
  Reading this without running JavaScript? Everything you need is plain text:
    /llms.txt        what this site is, in a few lines
    /spec.md         the whole vocabulary, one page
    /examples/       the prototypes, each under fifteen lines
  The language is modulatejs: https://modulatejs.com
  A link is  https://coral.fm/#1<lz-string compressToEncodedURIComponent(code)>
-->
<header class="bar">
  <a class="brand" href="/"><i class="dot"></i><b>coral</b></a>
  <span class="dim host" id="host">coral.fm</span>
  <span class="grow"></span>
  <span class="pill" id="live" hidden></span>
  <span class="dim tagline">Riff, Play, Share.</span>
</header>

<main class="work">
  <section class="pane" id="pane">
    <div class="tabs" id="tabs"></div>
    <button class="mode tray-button" id="tray-button" hidden aria-expanded="false" title="the pictures this browser is keeping for you"></button>
    <div class="tray" id="tray" hidden></div>
    <button class="ghost" id="ghost" hidden title="add an init section with the defaults, to change them"></button>
    <div id="editor"></div>
    <div class="try" id="try" hidden>
      <div class="try-label">try one</div>
    </div>
  </section>

  <button class="split" id="split" role="separator" aria-orientation="vertical" aria-label="resize the editor and the device" title="drag to resize · double-click to reset"></button>

  <section class="stage" id="stage">
    <div class="device-fit" id="fit">
      <div class="scene" id="scene">
        <i class="floor" id="floor"></i>
        <div class="device" id="device">
          <div class="body">
            <div class="slab a"><i class="edge"></i><i class="lens"></i><i class="speaker"></i><i class="camera"></i><i class="button"></i></div>
            <div class="slab b"><i class="edge"></i><i class="crease"></i></div>
          </div>
          <div class="screen" id="screen">
            <iframe id="frame" src="/frame" title="device" allow="clipboard-write"></iframe>
            <i class="hinge-shadow"></i><i class="glare"></i><i class="home"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="knobs" id="knobs" hidden>
      <label id="knob-fold" hidden><span>fold</span><input type="range" min="0" max="1000" value="0"><button title="open or close it with the hinge's spring">▶</button></label>
      <label id="knob-turn"><span>turn</span><input type="range" min="0" max="1000" value="0"><button title="turn it with a spring">▶</button></label>
      <select id="pick-device" title="which device the file is for: this writes device() into it">
        <option value="iphone">iphone</option><option value="iphone pro max">iphone pro max</option><option value="iphone se">iphone se</option><option value="pixel">pixel</option><option value="ipad">ipad</option><option value="iphone fold">iphone fold</option><option value="none">canvas</option>
      </select>
    </div>
    <div class="status"><span id="status-left"></span><span id="status-right"></span></div>
  </section>

</main>

<footer class="foot">
  <div class="actions">
    <button class="btn primary" id="phone"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M0 0h6v6H0zm1.5 1.5v3h3v-3zM8 0h6v6H8zm1.5 1.5v3h3v-3zM0 8h6v6H0zm1.5 1.5v3h3v-3zM8 8h2v2H8zm4 0h2v2h-2zm-2 2h2v2h-2zm-2 2h2v2H8zm4 0h2v2h-2z"/></svg>open on phone</button>
    <button class="btn" id="copy">copy link</button>
    <button class="btn" id="record" title="record what you do on the phone: the take goes in the link, and the link plays it back">● record</button>
    <button class="btn" id="play" hidden title="play the take that is in the link">▶ take</button>
    <button class="btn" id="drop-take" hidden title="drop the take from the link">✕</button>
    <button class="btn" id="room" aria-disabled="true" title="rooms come with the relay: watch a model edit live">room</button>
    <span class="dim hint" id="hint" hidden>drag any number, click any word; ⌥ hides it all · back = undo · every old link is a version</span>
  </div>
  <nav class="links">
    <a href="/spec.md">spec.md</a>
    <a href="/llms.txt">llms.txt</a>
    <a href="/library">modulatejs</a>
    <a href="/library#install">npx modulatejs</a>
    <a href="https://github.com/freddieiboy/modulatejs">github</a>
  </nav>
</footer>

<div class="pop" id="qr" hidden>
  <div id="qr-code"></div>
  <p id="qr-note">scan to open this on your phone</p>
</div>

<noscript>
  <div class="noscript">
    <h1>coral</h1>
    <p><b>Riff, Play, Share.</b> Prototype in <a href="https://modulatejs.com">ModulateJS</a>, markdown for UI interactions: write fifteen lines, get a link, feel it on a phone. The editor needs JavaScript; the language doesn't need the editor.</p>
    <p><a href="/spec.md">spec.md</a> · <a href="/llms.txt">llms.txt</a> · <a href="/library.md">library.md</a> · <a href="/examples/index.json">examples</a></p>
  </div>
</noscript>
<script src="/app.js" defer></script>
</body>
</html>
